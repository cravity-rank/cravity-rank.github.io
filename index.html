<title>CRAVITY 本命曲對決</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://is1-ssl.mzstatic.com">

<style>
/* 版面參考 Alliatus：淺灰底、白卡細框、粉藍色塊、襯線標題配粗斜體強調、黑色膠囊按鈕、星芒點綴 */
:root{
  --bg:#efefed; --surface:#ffffff; --ink:#151515; --muted:#6c6c6c; --line:#e1e1dd;
  --blue:#c6dbf3; --blue-soft:#e7f0fa; --blue-deep:#2a64aa; --btn:#151515; --btn-ink:#ffffff; --shadow:rgba(20,30,50,.10);
  --f-display:"Playfair Display","Noto Serif TC","Noto Serif KR",serif;
  --f-head:"Noto Serif TC","Noto Serif KR","Playfair Display",serif;
  --f-body:"Inter","Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1a1d21; --ink:#f0f0ee; --muted:#9a9fa6; --line:#2b2f35;
  --blue:#223650; --blue-soft:#1b2736; --blue-deep:#8cb7ea; --btn:#f0f0ee; --btn-ink:#111316; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1a1d21; --ink:#f0f0ee; --muted:#9a9fa6; --line:#2b2f35;
  --blue:#223650; --blue-soft:#1b2736; --blue-deep:#8cb7ea; --btn:#f0f0ee; --btn-ink:#111316; --shadow:rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
em.k{font-family:var(--f-display);font-style:italic;font-weight:800;letter-spacing:-.01em}

/* 頂列 */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 20px}
.logo{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;text-decoration:none}
.logo i{font-weight:800;color:var(--blue-deep)}
.nav-r{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);transition:transform .15s,opacity .15s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn:focus-visible,.chip:focus-visible,.cover:focus-visible,.prev:focus-visible,.tile:focus-visible,.row-play:focus-visible,.tog:focus-visible{outline:2px solid var(--blue-deep);outline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}

/* 粉藍主視覺區塊 */
.hero{position:relative;background:var(--blue);border-radius:var(--r-lg);padding:clamp(26px,5vw,52px);overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.hero h1,.hero h2{font-family:var(--f-head);font-weight:700;font-size:clamp(30px,5.6vw,54px);line-height:1.15;margin:0;max-width:13em;position:relative;z-index:2}
.hero p{margin:0;max-width:30em;color:var(--ink);opacity:.78;position:relative;z-index:2}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:2}
.deco{position:absolute;pointer-events:none;user-select:none;z-index:1;filter:drop-shadow(0 10px 18px rgba(30,60,100,.18))}
.spark{position:absolute;pointer-events:none;z-index:1;color:var(--ink)}
.spark.o{color:var(--surface)}

/* 白卡 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:clamp(18px,3.4vw,30px)}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
.sec-h h2{font-family:var(--f-head);font-weight:700;font-size:clamp(22px,3.4vw,30px);margin:0;line-height:1.2}
.sec-h .tools{display:flex;gap:8px;flex-wrap:wrap}

/* 設定：專輯與類型 */
.types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tog{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.tog::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted)}
.tog[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue-deep)}
.tog[aria-pressed="true"]::before{border-color:var(--blue-deep);background:var(--blue-deep);box-shadow:inset 0 0 0 2.5px var(--blue-soft)}
.years{display:flex;flex-direction:column;gap:14px}
.year{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.year > span{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:18px;color:var(--blue-deep);padding-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:4px 14px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;text-align:left;max-width:100%}
.chip img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue-deep)}
.chip[aria-pressed="false"]{opacity:.55}
.chip[aria-pressed="false"] img{filter:grayscale(1)}
.startbar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 14px 30px -12px var(--shadow)}
.startbar b{font-family:var(--f-display);font-size:20px}
.startbar .btn{background:var(--btn-ink);color:var(--btn);border-color:var(--btn-ink)}

/* 對決 */
.top{display:flex;align-items:center;gap:12px}
.meter{flex:1;height:6px;border-radius:6px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue-deep);width:0;transition:width .35s ease}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,2vw,18px);align-items:stretch;position:relative}
.song{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:clamp(10px,1.8vw,16px);display:flex;flex-direction:column;gap:12px;min-width:0;transition:transform .2s ease,opacity .2s ease,border-color .2s}
.cover{display:block;width:100%;padding:0;border:0;background:var(--blue-soft);cursor:pointer;aspect-ratio:1/1;border-radius:var(--r-sm);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.cover:hover img{transform:scale(1.03)}
.info{display:flex;flex-direction:column;gap:4px;min-width:0;padding:0 2px}
.title{font-family:var(--f-head);font-weight:700;font-size:clamp(17px,3.2vw,26px);line-height:1.25;margin:0;overflow-wrap:anywhere}
.meta{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.song .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.prev{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--blue-soft);cursor:pointer;font-size:13.5px;font-weight:500}
.prev svg{width:12px;height:12px;fill:currentColor}
.prev .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--blue-deep)}
.prev.on{border-color:var(--blue-deep);color:var(--blue-deep)}
.pick{width:100%}
.song.picked{border-color:var(--blue-deep);transform:translateY(-4px)}
.song.lost{opacity:.4}
.vs{display:flex;align-items:center;justify-content:center;position:relative;width:clamp(30px,6vw,64px)}
.vs svg{position:absolute;width:clamp(44px,8vw,78px);height:auto;color:var(--ink);top:28%}
.vs b{position:absolute;top:28%;width:clamp(44px,8vw,78px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:clamp(12px,2vw,18px);color:var(--bg)}
.ic-pause,.on .ic-play{display:none}
.on .ic-pause{display:inline}

/* 結果 */
.result-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);align-items:center;gap:24px}
.crown{position:relative;z-index:2;width:100%;max-width:300px;justify-self:center}
.crown .tile{border-radius:var(--r-md);box-shadow:0 20px 40px -18px rgba(20,40,80,.45)}
.crown .rk{font-size:22px}
.no1{font-family:var(--f-head);font-weight:700;font-size:clamp(24px,4vw,40px);line-height:1.2;margin:0}
.nine{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.4vw,20px)}
.nine li{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{position:relative;display:block;width:100%;aspect-ratio:1/1;padding:0;border:0;border-radius:var(--r-sm);overflow:hidden;background:var(--blue-soft);cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .rk{position:absolute;left:8px;top:8px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--surface);color:var(--ink);font-family:var(--f-display);font-style:italic;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.nine li:nth-child(-n+3) .rk{background:var(--blue-deep);color:#fff}
.tile .pl{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);color:#151515;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.tile .pl svg{width:11px;height:11px;fill:currentColor}
.tile:hover .pl,.tile.on .pl,.tile:focus-visible .pl{opacity:1}
.tile .bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--blue-deep)}
.cap{margin:0;line-height:1.35;min-width:0}
.cap a{display:block;font-weight:600;font-size:clamp(12.5px,2.4vw,15px);text-decoration:none;overflow-wrap:anywhere}
.cap a:hover{color:var(--blue-deep)}
.cap span{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.rows{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.rows li{display:grid;grid-template-columns:34px 48px minmax(0,1fr);gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm)}
.rows .n{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:17px;color:var(--blue-deep);text-align:center}
.row-play{position:relative;width:48px;height:48px;padding:0;border:0;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--blue-soft)}
.row-play img{width:100%;height:100%;object-fit:cover}
.row-play .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;opacity:0;transition:opacity .2s}
.row-play .pl svg{width:12px;height:12px;fill:currentColor}
.row-play:hover .pl,.row-play.on .pl{opacity:1}
.row-play .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--blue)}
.rows .cap a{font-size:14px}

/* 結果圖預覽 */
dialog{border:0;border-radius:var(--r-md);padding:0;background:var(--surface);color:var(--ink);max-width:min(92vw,900px);width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,14,20,.55)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:16px}
.dlg img{width:100%;border-radius:var(--r-sm);border:1px solid var(--line)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.dlg .hint{margin-right:auto;font-size:12.5px;color:var(--muted)}

@media (max-width:720px){
  body{font-size:14px}
  .nav{padding-left:16px}
  .hero{min-height:0}
  .hero.intro{padding-bottom:170px}
  .result-hero{grid-template-columns:1fr}
  .crown{max-width:240px}
  .year{grid-template-columns:1fr;gap:6px}
  .year > span{padding-top:0;font-size:16px}
  .song{gap:10px}
  .prev{padding:8px 10px;font-size:12.5px}
  .pick{padding:10px 8px;font-size:13.5px}
  .startbar{border-radius:var(--r-md);padding:12px 12px 12px 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="am_"+Math.random().toString(36).slice(2);
    const sc=document.createElement("script");
    const to=setTimeout(()=>{done();rej(new Error("timeout"))},12000);
    function done(){clearTimeout(to);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove()}
    window[cb]=d=>{done();res(d)};
    sc.onerror=()=>{done();rej(new Error("blocked"))};
    sc.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
    document.head.appendChild(sc);
  });
}

// 單一播放器：同一時間只播一首
const audio = new Audio(); audio.preload="none";
let playingId = null;
const refreshed = new Set();
function sync(){
  document.querySelectorAll("[data-play]").forEach(el=>{
    const on=+el.dataset.play===playingId;
    el.classList.toggle("on",on); el.setAttribute("aria-pressed",on);
    if(!on){ const b=el.querySelector(".bar"); if(b) b.style.width=0; }
  });
}
audio.addEventListener("timeupdate",()=>{ document.querySelectorAll(`[data-play="${playingId}"] .bar`).forEach(b=>b.style.width=(audio.currentTime/(audio.duration||30)*100)+"%"); });
audio.addEventListener("ended",()=>{ playingId=null; sync(); });
function stopAudio(){ audio.pause(); playingId=null; sync(); }
function playSong(s){ audio.src=s.pv; audio.currentTime=0; return audio.play(); }
async function toggle(id){
  if(playingId===id){ stopAudio(); return; }
  const s=SONGS[id]; playingId=id; sync();
  try{ await playSong(s); }
  catch(e){
    if(playingId!==id || e.name==="AbortError" || e.name==="NotAllowedError"){ if(playingId===id){playingId=null;sync()} return; }
    // 試聽網址失效時，向 Apple 重新取一次
    if(!refreshed.has(id)){
      refreshed.add(id);
      try{
        const r=(await jsonp(`https://itunes.apple.com/lookup?id=${s.i}&country=${SF}`)).results?.[0];
        if(r&&r.previewUrl&&playingId===id){ s.pv=r.previewUrl; await playSong(s); return; }
      }catch(_){}
    }
    if(playingId===id){ playingId=null; sync(); }
  }
}

const STAR=(n=8,inner=.42)=>{let p="";for(let k=0;k<n*2;k++){const r=k%2?inner*50:50,a=Math.PI*k/n-Math.PI/2;p+=(k?"L":"M")+(50+r*Math.cos(a)).toFixed(1)+" "+(50+r*Math.sin(a)).toFixed(1)}return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${p}Z" fill="currentColor"/></svg>`};

// 排序方式：淘汰賽樹，只取前 K 名。所有歌排進一張固定的對戰表，先打一輪淘汰賽選出第 1 名；
// 把冠軍拿掉後，只有冠軍走過的那條路要重賽（約 log2 n 場），其他場次的結果沿用，
// 就能依序選出第 2、3…K 名。狀態只記「洗牌後的對戰表」和「每場的結果」，上一步＝刪掉最後一場。
const KEY = "cravity-rank-v2";
const TOPK = 30;
let S;          // 進行中的狀態 {K, order, res:[[a,b,勝者]], est}
let SEL = {albums:ALBUMS.map(x=>x.a), tt:true, bs:true};  // 設定畫面的選擇
let CUR = null; // solve(S) 的結果：{need:[a,b]} 或 {final:[...]}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function poolOf(sel){ return SONGS.filter(s=>sel.albums.includes(s.a) && (s.tt?sel.tt:sel.bs)).map(s=>s.id); }
const pairKey=(a,b)=>a<b?a+"|"+b:b+"|"+a;
function solve(s){
  const memo=new Map(s.res.map(([a,b,w])=>[pairKey(a,b),w]));
  const out=new Set(), ranked=[]; let need=null;
  function win(lo,hi){
    if(hi-lo===1){ const id=s.order[lo]; return out.has(id)?null:id; }
    const mid=(lo+hi)>>1, a=win(lo,mid); if(need) return null; const b=win(mid,hi); if(need) return null;
    if(a==null) return b; if(b==null) return a;
    const w=memo.get(pairKey(a,b)); if(w===undefined){ need=[a,b]; return null; } return w;
  }
  while(ranked.length<s.K){ const w=win(0,s.order.length); if(need) return {need,ranked}; if(w==null) break; ranked.push(w); out.add(w); }
  return {final:ranked};
}
// 預估總場數：用隨機偏好模擬幾次取平均
function estimate(n){
  if(n<2) return 0;
  let tot=0;
  for(let t=0;t<3;t++){
    const val=shuffle([...Array(n).keys()]), s={K:Math.min(TOPK,n),order:[...Array(n).keys()],res:[]}; let r;
    while((r=solve(s)).need){ const [a,b]=r.need; s.res.push([a,b,val[a]<val[b]?a:b]); }
    tot+=s.res.length;
  }
  return Math.round(tot/3);
}
const estCache=new Map();
const estimateCached=n=>{ if(!estCache.has(n)) estCache.set(n,estimate(n)); return estCache.get(n); };
function fresh(pool){ return {K:Math.min(TOPK,pool.length),order:shuffle(pool),res:[],est:estimateCached(pool.length)}; }
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,SEL}))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)); if(v&&v.SEL) SEL=v.SEL; if(v&&v.S&&Array.isArray(v.S.order)) return v.S;}catch(e){} return null}

  $("stage").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="top"><span class="pill">第 ${done+1} 場 · 約剩 ${rem}</span><div class="meter" aria-hidden="true"><i style="width:${done/(done+rem)*100}%"></i></div></div>
    <div class="duel">${card(A,"L")}<div class="vs" aria-hidden="true">${STAR(10,.62)}<b>VS</b></div>${card(B,"R")}</div>
  </div>`;
  sync();
}

/* ---------- 結果畫面 ---------- */
function renderResult(){
  const f=CUR.final, c=SONGS[f[0]];
  $("navR").innerHTML=`<button class="btn ghost sm" type="button" data-act="setup">重新開始</button>`;
  const tile=(id,k,sizes,eager)=>{const s=SONGS[id];return `<button class="tile" type="button" data-play="${id}" aria-pressed="false" aria-label="第 ${k+1} 名〈${esc(s.t)}〉，試聽">${coverImg(s,sizes,eager)}<span class="rk">${k+1}</span><span class="pl">${PLAY}${PAUSE}</span><i class="bar"></i></button>`};
  const cap=s=>`<p class="cap"><a href="${amLink(s)}" target="_blank" rel="noopener">${esc(s.t)}</a><span>${esc(s.a)} · ${s.y}</span></p>`;
  const nine=f.slice(1,10), rest=f.slice(10);
  $("stage").innerHTML=`<div style="display:flex;flex-direction:column;gap:18px">
    <section class="hero">
      <div class="result-hero">
        <div style="display:flex;flex-direction:column;gap:14px;position:relative;z-index:2">
          <span class="pill" style="align-self:flex-start">共比了 ${S.res.length} 場</span>
          <h2>Your <em class="k">Top ${f.length}</em></h2>
          <p class="no1">No.1 · ${esc(c.t)}</p>
          <p style="margin:0;opacity:.7">${esc(c.a)} · ${c.y}</p>
          <div class="actions"><button class="btn" type="button" data-act="export">輸出 4:3 結果圖</button><a class="btn ghost" href="${amLink(c)}" target="_blank" rel="noopener">Apple Music ↗</a></div>
        </div>
        <div class="crown">${tile(f[0],0,"(max-width:720px) 240px, 300px",true)}</div>
      </div>
      ${deco("tape","left:52%;bottom:-18px;width:clamp(90px,13vw,150px);transform:rotate(-12deg)")}
      ${deco("lightstick","right:14px;top:-10px;width:clamp(44px,6vw,70px);transform:rotate(18deg)")}
      ${spark("left:46%;top:26px;width:30px","",8,.4)}
    </section>
    ${nine.length?`<section class="card"><div class="sec-h"><h2>第 2–${nine.length+1} 名</h2></div><ol class="nine">${nine.map((id,k)=>`<li>${tile(id,k+1,"(max-width:720px) 30vw, 300px",k<3)}${cap(SONGS[id])}</li>`).join("")}</ol></section>`:""}
    ${rest.length?`<section class="card"><div class="sec-h"><h2>第 11–${f.length} 名</h2></div><ol class="rows">${rest.map((id,k)=>{const s=SONGS[id];return `<li><span class="n">${k+11}</span><button class="row-play" type="button" data-play="${id}" aria-pressed="false" aria-label="試聽〈${esc(s.t)}〉"><img src="${art(s,100)}" alt="" loading="lazy" width="48" height="48"><span class="pl">${PLAY}${PAUSE}</span><i class="bar"></i></button>${cap(s)}</li>`}).join("")}</ol></section>`:""}
  </div>`;
  sync();
}

function render(){
  if(!S){ renderSetup(); return; }
  CUR=solve(S);
  if(CUR.final) renderResult(); else renderDuel();
}

function pick(side){
  if(!S||!CUR||!CUR.need) return;
  stopAudio();
  const [a,b]=CUR.need;
  S.res.push([a,b,side==="L"?a:b]);
  CUR=solve(S);
  // 先預載下一場的封面，換場時不會閃白
  if(CUR.need) for(const id of CUR.need){ const im=new Image(); im.src=art(SONGS[id],600); }
  const el=document.querySelector(`.song[data-side="${side}"]`);
  const other=document.querySelector(`.song:not([data-side="${side}"])`);
  if(el){el.classList.add("picked"); other&&other.classList.add("lost");
    setTimeout(()=>{save();render();window.scrollTo({top:0,behavior:"smooth"})},matchMedia("(prefers-reduced-motion:reduce)").matches?0:240);
  } else {save();render()}
}

/* ---------- 4:3 結果圖 ---------- */
function loadImg(src,cors){return new Promise(res=>{const im=new Image(); if(cors) im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src;})}
function rrect(x,c,y,w,h,r){x.beginPath();x.moveTo(c+r,y);x.arcTo(c+w,y,c+w,y+h,r);x.arcTo(c+w,y+h,c,y+h,r);x.arcTo(c,y+h,c,y,r);x.arcTo(c,y,c+w,y,r);x.closePath();}
function fit(x,t,w){ if(x.measureText(t).width<=w) return t; while(t.length>1&&x.measureText(t+"…").width>w) t=t.slice(0,-1); return t+"…"; }
function drawCover(x,im,X,Y,sz,r){ x.save(); rrect(x,X,Y,sz,sz,r); x.clip(); if(im) x.drawImage(im,X,Y,sz,sz); else {x.fillStyle="#e7f0fa";x.fillRect(X,Y,sz,sz);} x.restore(); }
function drawStar(x,cx,cy,R,n,inner,color){ x.beginPath(); for(let k=0;k<n*2;k++){const r=k%2?R*inner:R,a=Math.PI*k/n-Math.PI/2; x[k?"lineTo":"moveTo"](cx+r*Math.cos(a),cy+r*Math.sin(a));} x.closePath(); x.fillStyle=color; x.fill(); }
function drawDeco(x,im,cx,cy,w,rot){ if(!im) return; const h=w*im.height/im.width; x.save(); x.translate(cx,cy); x.rotate(rot*Math.PI/180); x.shadowColor="rgba(30,60,100,.22)"; x.shadowBlur=24; x.shadowOffsetY=10; x.drawImage(im,-w/2,-h/2,w,h); x.restore(); }
async function exportImage(){
  const btn=document.querySelector('[data-act="export"]'); if(btn){btn.disabled=true;btn.textContent="產生中…";}
  const f=CUR.final, done=S.res.length, W=2000, H=1500;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  const allText=f.map(id=>SONGS[id].t+SONGS[id].a).join("")+"My CRAVITY Top 30 No.";
  await Promise.all(['700 60px "Noto Serif TC"','600 30px "Noto Serif KR"','800 italic 60px "Playfair Display"','700 60px "Playfair Display"','600 24px "Inter"','500 24px "Noto Sans TC"','700 24px "Noto Sans TC"'].map(q=>document.fonts.load(q,allText).catch(()=>{})));
  const [covers,decos]=await Promise.all([
    Promise.all(f.map((id,k)=>loadImg(art(SONGS[id],k===0?900:k<3?600:200),true))),
    Promise.all(["lightstick","cheese","tape","cloud9"].map(n=>loadImg(`img/${n}.webp`)))
  ]);
  const INK="#151515", MUTED="#6c6c6c", BLUE="#c6dbf3", DEEP="#2a64aa", SERIF='"Noto Serif TC","Noto Serif KR",serif', SANS='"Inter","Noto Sans TC",sans-serif', DISP='"Playfair Display",serif';
  x.fillStyle="#efefed"; x.fillRect(0,0,W,H);
  // 標題
  x.fillStyle=INK; x.textBaseline="alphabetic";
  x.font=`700 72px ${DISP}`; x.fillText("My CRAVITY",90,140);
  const w1=x.measureText("My CRAVITY ").width;
  x.fillStyle=DEEP; x.font=`italic 800 72px ${DISP}`; x.fillText(`Top ${f.length}`,90+w1,140);
  x.fillStyle=MUTED; x.font=`500 24px ${SANS}`; x.textAlign="right";
  const d=new Date(); x.fillText(`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}  ·  ${done} 場對決`,W-90,128);
  x.textAlign="left";
  drawStar(x,W-90-x.measureText(`${d.getFullYear()}.00.00  ·  ${done} 場對決`).width-70,118,26,8,.42,INK);
  // 左側粉藍區塊：第 1–3 名
  const PX=90, PY=200, PW=820, PH=1210;
  x.fillStyle=BLUE; rrect(x,PX,PY,PW,PH,44); x.fill();
  drawDeco(x,decos[0],PX+PW-40,PY+90,110,16);
  drawDeco(x,decos[1],PX+50,PY+PH-24,130,-12);
  drawStar(x,PX+80,PY+80,30,4,.22,"#ffffff");
  const c1=560, cx1=PX+(PW-c1)/2, cy1=PY+70;
  x.save(); x.shadowColor="rgba(20,40,80,.35)"; x.shadowBlur=50; x.shadowOffsetY=24; x.fillStyle="#fff"; rrect(x,cx1,cy1,c1,c1,28); x.fill(); x.restore();
  drawCover(x,covers[0],cx1,cy1,c1,28);
  x.fillStyle=DEEP; rrect(x,cx1+18,cy1+18,96,50,25); x.fill();
  x.fillStyle="#fff"; x.font=`italic 800 30px ${DISP}`; x.textAlign="center"; x.fillText("No.1",cx1+66,cy1+53);
  const s1=SONGS[f[0]];
  x.fillStyle=INK; x.font=`700 54px ${SERIF}`; x.fillText(fit(x,s1.t,PW-80),PX+PW/2,cy1+c1+86);
  x.fillStyle="rgba(21,21,21,.66)"; x.font=`500 24px ${SANS}`; x.fillText(fit(x,`${s1.a} · ${s1.y}`,PW-120),PX+PW/2,cy1+c1+128);
  const c2=250, gap=40, y2=cy1+c1+180;
  [1,2].forEach((k,j)=>{ if(!f[k]) return; const X=PX+(PW-(c2*2+gap))/2+j*(c2+gap), s=SONGS[f[k]];
    drawCover(x,covers[k],X,y2,c2,22);
    x.fillStyle="#fff"; rrect(x,X+12,y2+12,64,40,20); x.fill();
    x.fillStyle=INK; x.font=`italic 800 24px ${DISP}`; x.fillText(`No.${k+1}`,X+44,y2+40);
    x.fillStyle=INK; x.font=`700 28px ${SERIF}`; x.fillText(fit(x,s.t,c2+30),X+c2/2,y2+c2+44);
    x.fillStyle="rgba(21,21,21,.6)"; x.font=`500 19px ${SANS}`; x.fillText(fit(x,s.a,c2+20),X+c2/2,y2+c2+74);
  });
  x.textAlign="left";
  // 右側：第 4–30 名，3 欄 × 9 列
  const RX=950, RY=200, RW=W-90-RX, cols=3, rows=9, gx=16, gy=14;
  const cw=(RW-gx*(cols-1))/cols, ch=(PH-gy*(rows-1))/rows;
  f.slice(3).forEach((id,j)=>{ const k=j+3, col=Math.floor(j/rows), row=j%rows; if(col>=cols) return;
    const X=RX+col*(cw+gx), Y=RY+row*(ch+gy), s=SONGS[id];
    x.fillStyle="#fff"; rrect(x,X,Y,cw,ch,20); x.fill(); x.strokeStyle="#e1e1dd"; x.lineWidth=2; x.stroke();
    const cs=ch-28; drawCover(x,covers[k],X+14,Y+14,cs,12);
    const tx=X+14+cs+16, tw=cw-(tx-X)-14;
    x.fillStyle=DEEP; x.font=`italic 800 26px ${DISP}`; x.fillText(String(k+1),tx,Y+40);
    x.fillStyle=INK; x.font=`700 23px ${SERIF}`; x.fillText(fit(x,s.t,tw),tx,Y+72);
    x.fillStyle=MUTED; x.font=`500 17px ${SANS}`; x.fillText(fit(x,s.a,tw),tx,Y+98);
  });
  drawDeco(x,decos[2],W-140,H-38,130,-8);
  x.fillStyle=MUTED; x.font=`500 22px ${SANS}`; x.fillText("",90,H-40);
  // 輸出
  const url=cv.toDataURL("image/png");
  $("shot").src=url; $("dlgSave").href=url;
  if(btn){btn.disabled=false;btn.textContent="輸出 4:3 結果圖";}
  $("dlg").showModal();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-pick]"); if(b){ pick(b.dataset.pick); return; }
  const pv=e.target.closest("[data-play]"); if(pv){ toggle(+pv.dataset.play); return; }
  const ch=e.target.closest("[data-alb]");
  if(ch){ const a=ch.dataset.alb, on=SEL.albums.includes(a); SEL.albums=on?SEL.albums.filter(v=>v!==a):SEL.albums.concat(a); ch.setAttribute("aria-pressed",!on); updateSel(); save(); return; }
  const ty=e.target.closest("[data-type]");
  if(ty){ const k=ty.dataset.type; SEL[k]=!SEL[k]; ty.setAttribute("aria-pressed",SEL[k]); updateSel(); save(); return; }
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="all"||act==="none"){ SEL.albums=act==="all"?ALBUMS.map(x=>x.a):[]; document.querySelectorAll("[data-alb]").forEach(c=>c.setAttribute("aria-pressed",act==="all")); updateSel(); save(); }
  if(act==="start"){ const pool=poolOf(SEL); if(pool.length<2) return; S=fresh(pool); save(); render(); window.scrollTo({top:0}); }
  if(act==="resume"){ render(); }
  if(act==="setup"){ stopAudio(); renderSetup(); window.scrollTo({top:0}); }
  if(act==="undo"){ stopAudio(); if(!S.res.length) return; S.res.pop(); save(); render(); }
  if(act==="export"){ exportImage(); }
});
$("dlgClose").onclick=()=>$("dlg").close();
document.addEventListener("keydown",e=>{
  if(!CUR||!CUR.need||!document.querySelector(".duel")) return;
  if(e.key==="ArrowLeft") pick("L");
  if(e.key==="ArrowRight") pick("R");
});

S=load();
render();
</script>
</body>
